<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/shadow.css">
    <title>Varjo harjoituksia</title>
</head>
<body>
    <main>
        <h1>Varjo harjoituksia</h1>
        <p>Tässä on esimerkkejä varjojen käytöstä CSS:ssä.</p>
        <div class="shadow-box">
            <p>Tämä laatikko sisältää varjon.</p>
        </div>
        <div class="shadow-text">
            <p>Tämä teksti sisältää varjon.</p>
        </div>
        <h2>Lisää harjoituksia</h2>
            <button class="shadow-button">Varjollinen nappi</button>   
            <div class="hero-image">Testataan, miten tämä toimimi</div>
    </main>    
</body>
</html>
