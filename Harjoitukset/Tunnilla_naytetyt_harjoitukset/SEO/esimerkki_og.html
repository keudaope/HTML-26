<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sivustosi otsikko (näkyy selaimen välilehdessä)</title>

    <!-- ALOITUS: SOSIAALISEN MEDIAN JAKO-ASETUKSET (OPEN GRAPH) -->

    <!-- Tähän kirjoitetaan sivun pääotsikko, joka näkyy isona tekstinä esimerkiksi Facebook-jaossa -->
    <meta
      property="og:title"
      content="Kirjoita tähän sivusi houkutteleva otsikko"
    />

    <!-- Tähän kirjoitetaan lyhyt kuvausteksti (1-2 lausetta), joka kertoo mistä sivussa on kyse -->
    <meta
      property="og:description"
      content="Kirjoita tähän lyhyt esittelyteksti, joka houkuttelee ihmisiä klikkaamaan linkkiäsi."
    />

    <!-- Tähän laitetaan suora nettiosoite kuvaan, jonka haluat näkyvän jaon yhteydessä -->
    <meta property="og:image" content="https://sinunsivusi.fi" />

    <!-- Tähän kirjoitetaan tämän kyseisen sivun tarkka nettiosoite -->
    <meta property="og:url" content="https://sinunsivusi.fi" />

    <!-- Tämä kertoo, että kyseessä on tavallinen verkkosivusto (jätä tällaisenaan) -->
    <meta property="og:type" content="website" />

    <!-- Tämä kertoo Facebookille ja muille, että sivusto on suomenkielinen (jätä tällaisenaan) -->
    <meta property="og:locale" content="fi_FI" />

    <!-- LOPETUS: SOSIAALISEN MEDIAN JAKO-ASETUKSET -->
  </head>
  <body>
    <h1>Tervetuloa sivustolleni!</h1>
    <p>Tämä on tekstialue, joka näkyy tavalliselle nettisivun selaajalle.</p>
  </body>
</html>
