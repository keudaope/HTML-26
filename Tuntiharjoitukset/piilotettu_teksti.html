<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vain lukijalle</title>
  </head>
  <body>
    <style>
      .sr-only {
        overflow: hidden;
        clip-path: circle(0%);
      }
    </style>
    <h1>Vain screen-readerin käyttöön</h1>
    <div class="sr-only">
      <p>This content is only visible to screen readers.</p>
    </div>
  </body>
</html>
