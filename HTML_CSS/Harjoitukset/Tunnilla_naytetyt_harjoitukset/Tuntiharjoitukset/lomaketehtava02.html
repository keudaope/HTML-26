<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lomaketehtävä 2</title>
  </head>
  <body>
    <style>
      label,
      button {
        display: block;
        margin-top: 10px;
      }
      input,
      textarea,
      fieldset {
        width: 50%;
        padding: 5px;
        margin-top: 15px;
      }
    </style>
    <form>
      <label for="kayttajanimi">Käyttäjänimi:</label>
      <input id="kayttajanimi" name="kayttajanimi" type="text" />
      <label for="sahkoposti">Sähköposti:</label>
      <input
        id="sahkoposti"
        name="sahkoposti"
        type="email"
        placeholder="nimi@esimerkki.fi"
      />
      <label for="salasana">Salasana:</label>
      <input
        type="password"
        id="salasana"
        name="salasana"
        placeholder="Salasana"
      />
      <label for="salasana2">Salasana uudelleen:</label>
      <input
        type="password"
        id="salasana2"
        name="salasana2"
        placeholder="Salasana uudelleen"
      />
      <label for="syntymapaiva">Syntymäpäivä:</label>
      <input type="date" id="syntymapaiva" name="syntymapaiva" />
      <fieldset>
        <legend>Käyttöehtojen hyväksyntä</legend>
        <label for="kayttoehdot">Hyväksyn käyttöehdot:</label>
        <input type="checkbox" id="kayttoehdot" name="kayttoehdot" checked />
      </fieldset>
      <button type="submit">Lähetä</button>
    </form>
  </body>
</html>
