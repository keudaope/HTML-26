<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/animaatio.css">
    <title>Animaatioesimerkkejä</title>
</head>
<body>
    <main>
        <h1>Animaatioesimerkkejä</h1>
        <section class="esimerkit">
            <h2>Liike</h2>
            <article class="liike"></article>
            <h2>Kasvatus</h2>
            <article class="kasvu"></article>
            <h2>Pyörintä</h2>
            <article class="pyorinta"></article>
            <h2 style="font-size:8px">Vinoutus</h2>
            <article class="vino"></article>
            <h2>Kääntö</h2>
            <article class="kaanto"></article>
            <h2>Oikea vinoutus</h2>
            <article class="vinoutus"></article>
        </section>
        <section class="lomake">
            <form action="">
                <label for="nimi">Anna koko nimi:</label>
                <input type="text" id="nimi" name="nimi">
                <button type="submit">Lähetä</button>
            </form>
        </section>
    </main>
</body>
</html>
