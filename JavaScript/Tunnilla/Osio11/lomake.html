<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lomake esimerkki</title>
    <script src="lomake.js" defer></script>
    <link rel="stylesheet" href="lomake.css" />
  </head>
  <body>
    <section>
      <h1>Lomake</h1>
      <form action="#" method="post" id="lomake">
        <label for="name">Nimi:</label>
        <input
          type="text"
          id="name"
          name="name"
          required
          minlength="4"
          maxlength="100"
          value="John Doe"
        />
        <br /><br />
        <label for="email">Sähköposti:</label>
        <input type="email" id="email" name="email" required value="john.doe@example.com" />
        <br /><br />
        <label for="password">Salasana:</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          minlength="6"
          value="password123"
        />
        <p id="vahvuus"></p>
        <br /><br />
        <label for="confirmPassword">Vahvista salasana:</label>
        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          required
          minlength="6"
          value="password122"
        />
        <br /><br />
        <label for="ehdot">Hyväksyn ehdot:</label>
        <input type="checkbox" id="ehdot" name="ehdot" required checked />
        <label for="message">Viesti:</label>
        <textarea id="message" name="message" rows="4" cols="50"></textarea>
        <br /><br />
        <input type="submit" value="Lähetä" />
      </form>
    </section>
  </body>
</html>
