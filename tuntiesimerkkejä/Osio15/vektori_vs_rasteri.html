<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

  <body>
    <svg width="400" height="200" style="border: 1px solid black">
      <circle cx="150" cy="100" r="10" fill="red" />
      <rect x="50" y="50" width="30" height="30" fill="blue" />
      <ellipse cx="200" cy="50" rx="20" ry="10" fill="green" />
      <line x1="0" y1="0" x2="400" y2="200" stroke="black" />
      <polyline
        points="0,200 100,150 200,200 300,150 400,200"
        fill="blue"
        stroke="orange"
      />
    </svg>
  </body>
